# SwiftLint configuration
# Inherits from the shared parent configuration in swift-standards

parent_config: https://raw.githubusercontent.com/swift-primitives/.github/main/.swiftlint.yml

# Package-specific overrides
disabled_rules:
  - function_parameter_count
  - force_try  # Deliberate: 2 Source sites construct Cardinal from a provably non-negative
               # Int (WHY comments at each site); ~22 Tests sites are fixture construction
               # from literal, always-valid Tensor.Shape dimensions (iso-8601 precedent).
